name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_patterns: |
              dist/BoostnoteSetup.exe
              dist/boost-*-full.nupkg
              dist/RELEASES
          - os: macos-latest
            platform: osx
            artifact_patterns: |
              dist/Boostnote-mac.*
          - os: ubuntu-22.04
            platform: linux
            artifact_patterns: |
              dist/*.deb
              dist/*.rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          architecture: 'x64'
          cache: 'npm'

      - name: Configure Git protocol rewrite
        run: git config --global url."https://github.com/".insteadOf git://github.com/

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot rpm

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npm install -g appdmg

      - name: Install npm dependencies
        env:
          npm_config_arch: x64
        run: npm install --legacy-peer-deps --arch=x64

      - name: Build and package
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Upload build artifacts (CI Run Summary)
        uses: actions/upload-artifact@v4
        with:
          name: boostnote-${{ matrix.platform }}
          path: ${{ matrix.artifact_patterns }}
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: boostnote-*
          merge-multiple: true
          path: release_assets

      - name: Determine release tag
        id: get_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: BoostNote ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
